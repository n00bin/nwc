<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#2a1a08"/>
      <stop offset="100%" stop-color="#0a0705"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8c878"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8b6f2f"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="#d4af37" stroke-width="1.5" stroke-opacity="0.55"/>

  <!-- trophy cup -->
  <path d="M 21 16 H 43 V 28 C 43 35 38 39 32 39 C 26 39 21 35 21 28 Z" fill="url(#gold)" stroke="#f0e2bc" stroke-width="0.8" stroke-opacity="0.6"/>
  <!-- handles -->
  <path d="M 21 19 H 15 C 15 27 18 29 22 30" fill="none" stroke="#d4af37" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 43 19 H 49 C 49 27 46 29 42 30" fill="none" stroke="#d4af37" stroke-width="2.2" stroke-linecap="round"/>
  <!-- stem + base -->
  <rect x="29.5" y="39" width="5" height="7" fill="#a5842f"/>
  <rect x="23" y="46" width="18" height="5" rx="1.5" fill="url(#gold)" stroke="#f0e2bc" stroke-width="0.6" stroke-opacity="0.5"/>
  <!-- tick on the cup -->
  <path d="M 26.5 26 L 30.5 30 L 38 21.5" fill="none" stroke="#2a1a08" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
