      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1;
      padding: 0;
    }
    .boon-btn:hover { border-color: var(--amber); color: var(--amber); }
    .boon-count {
      min-width: 38px;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--text);
    }

    .toggle-list { display: grid; grid-template-columns: 1fr 1fr; gap: 0.45rem; align-items: start; }
    .toggle {
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.6rem 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.15s;
    }
    .toggle:hover { background: var(--hover); }
    .toggle.on { border-color: var(--amber); background: rgba(240,136,62,0.08); color: var(--amber); }
    .toggle .check {
      width: 16px; height: 16px;
      border: 1px solid var(--border);
      border-radius: 4px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .toggle.on .check { background: var(--amber); border-color: var(--amber); }
    .toggle.on .check::after { content: "✓"; color: #000; font-size: 0.8rem; font-weight: 700; }
    .toggle .name { flex: 1; font-size: 0.88rem; }
    .toggle .effect { color: var(--text-mute); font-size: 0.78rem; font-style: italic; }
    .toggle.on .effect { color: var(--gold); font-style: normal; }

    /* ===== Action buttons ===== */
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      gap: 0.7rem;
      margin-top: 0.5rem;
    }
    .btn {
      padding: 0.7rem 1.4rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      border: 1px solid transparent;
      font-family: inherit;
      transition: all 0.15s;
    }
    .btn-primary { background: var(--amber); color: #000; border-color: var(--amber); }
    .btn-primary:hover { background: #ff9a4d; transform: translateY(-1px); }
    .btn-ghost   { background: transparent; color: var(--text-mute); border-color: var(--border); }
    .btn-ghost:hover { color: var(--text); }
    .btn-secondary { background: var(--elevated); color: var(--text); border-color: var(--border); }
    .btn-secondary:hover { background: var(--hover); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ===== Sticky footer: Build Score ===== */
    .footer-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, var(--surface) 90%, rgba(22,27,34,0.92));
      border-top: 2px solid var(--amber);
      padding: 0.85rem 2rem;
      display: grid;
      grid-template-columns: 280px 1fr auto;
      gap: 1.5rem;
      align-items: center;
      box-shadow: 0 -8px 24px rgba(0,0,0,0.4);
      z-index: 100;
    }
    .score-box { display: flex; align-items: center; gap: 0.8rem; }
    .gauge {
      width: 70px; height: 70px;
      border-radius: 50%;
      background: conic-gradient(var(--amber) 0%, var(--amber) calc(var(--p, 0) * 1%), var(--elevated) calc(var(--p, 0) * 1%), var(--elevated) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: background 0.4s;
    }
    .gauge::after {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      background: var(--surface);
    }
    .gauge .num {
      position: relative;
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--amber);
      z-index: 1;
    }
    .score-label { font-family: var(--font-display); }
    .score-label .title {
      font-size: 0.72rem;
      color: var(--text-mute);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .score-label .value {
      font-size: 1.1rem;
      color: var(--amber);
      font-weight: 700;
    }
    .score-label .desc { font-size: 0.78rem; color: var(--text-mute); }

    .quick-stats-wrap {
      display: flex; flex-direction: column;
      gap: 0.25rem; align-items: stretch;
    }
    .quick-stats-tag {
      font-size: 0.68rem;
      color: var(--text-mute);
      text-align: center;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: help;
    }
    .quick-stats-tag.has-buffs { color: var(--amber); }
    /* auto-fit: roles show different tile counts (tank runs 6 with
       Deflect + Deflect Severity paired, like CritStrike + CritSev) */
    .quick-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 0.4rem; }
    .quick-stat { text-align: center; padding: 0.3rem; }
    .quick-stat .label {
      font-size: 0.66rem;
      color: var(--text-mute);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.15rem;
    }
    .quick-stat .val {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      transition: color 0.3s;
    }
    .quick-stat .val.cap { color: var(--pos); }
    .mini-bar {
      height: 3px;
      background: var(--elevated);
      border-radius: 2px;
      margin-top: 0.2rem;
      overflow: hidden;
    }
    .mini-bar > div { height: 100%; background: var(--amber); transition: width 0.3s; }
    .mini-bar > div.cap { background: var(--pos); }

    /* Reinforcement kit chip — small button under each gear dropdown */
    .gear-kit-chip {
      margin-top: 0.4rem;
      padding: 0.3rem 0.5rem;
      font-size: 0.74rem;
      border: 1px dashed var(--border);
      border-radius: 5px;
      color: var(--text-dim);
      cursor: pointer;
      text-align: center;
      transition: border-color 0.12s, color 0.12s;
    }
    .gear-kit-chip:hover { border-color: var(--amber); color: var(--amber); }
    /* Gem-synergy status under an equipped Frostsilver-style ring. */
    .gem-syn-row {
      margin-top: 0.35rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      align-items: center;
      font-size: 0.72rem;
    }
    .gem-syn-pill {
      padding: 0.12rem 0.4rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      white-space: nowrap;
    }
    .gem-syn-pill.on  { color: #6ee7a8; border-color: rgba(110,231,168,0.45); background: rgba(110,231,168,0.08); }
    .gem-syn-pill.off { color: var(--text-dim); opacity: 0.8; }
    /* Set-completion status: shown on each equipped piece of a multi-slot set. */
    .set-syn-row {
      margin-top: 0.35rem;
      display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center;
      font-size: 0.72rem;
    }
    .set-syn-pill {
      padding: 0.12rem 0.4rem; border-radius: 999px;
      border: 1px solid var(--border); white-space: nowrap;
    }
    .set-syn-pill.on  { color: #6ee7a8; border-color: rgba(110,231,168,0.55); background: rgba(110,231,168,0.12); font-weight: 600; }
    .set-syn-pill.off { color: var(--text-dim); opacity: 0.85; }
    .gear-kit-chip.filled { border-style: solid; border-color: var(--gold); color: var(--gold); }

    /* Enchantment row — typed slot chips laid out side-by-side */
    .ench-row {
      display: flex; gap: 0.45rem; flex-wrap: wrap;
      margin-bottom: 0.5rem;
    }
    .ench-chip {
      flex: 1 1 110px;
      min-width: 110px;
      padding: 0.45rem 0.6rem;
      background: var(--elevated);
      border: 1px dashed var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
    }
    .ench-chip:hover { border-color: var(--amber); }
    .ench-chip.filled { border-style: solid; border-color: var(--gold); background: rgba(210,153,34,0.06); }
    .ench-chip-label {
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      font-weight: 600;
      margin-bottom: 0.15rem;
    }
    .ench-chip.filled .ench-chip-label { color: var(--gold); }
    .ench-chip-name {
      font-size: 0.84rem;
      color: var(--text);
      font-weight: 500;
    }
    .ench-chip:not(.filled) .ench-chip-name { color: var(--text-mute); font-style: italic; }

    /* Top loadout row: 5 chips (enchantment, enhancement, 3 equipment). */
    .comp-loadout {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.5rem;
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px dashed var(--border);
    }
    .comp-loadout-chip {
      background: var(--elevated);
      border: 1.5px dashed var(--border);
      border-radius: 8px;
      padding: 0.65rem 0.7rem;
      font-size: 0.8rem;
      color: var(--text-dim);
      cursor: pointer;
      text-align: center;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
      min-height: 56px;
      display: flex; align-items: center; justify-content: center;
    }
    .comp-loadout-chip:hover { border-color: var(--amber); }
    .comp-loadout-chip.filled {
      border-style: solid;
      border-color: var(--gold);
      background: rgba(210,153,34,0.08);
      color: var(--gold);
      font-weight: 600;
    }

    /* Companion picker rows (summoned + 5 active) — even sizes. */
    .comp-row-active { margin-bottom: 0.5rem; }
    .comp-row-active .comp-slot {
      aspect-ratio: auto;
      min-height: 56px;
      padding: 0.55rem 0.8rem;
    }
    .comp-row-active .comp-slot.summoned { min-height: 56px; }
    .comp-enh-slot, .comp-gear-slot {
      font-size: 0.76rem;
      padding: 0.4rem 0.55rem;
      min-height: auto;
      color: var(--text-mute);
    }
    .comp-enh-slot.filled { color: var(--gold); border-color: var(--gold); }
    .comp-gear-slot.filled { color: var(--gold); border-color: var(--gold); }

    /* ===== Searchable picker modal (companions, mounts, collars, insignias) ===== */
    .picker-overlay {
      display: none; position: fixed; inset: 0; z-index: 600;
      background: rgba(0,0,0,0.75);
      align-items: flex-start; justify-content: center;
      padding: 4vh 1rem; overflow-y: auto;
    }
    .picker-overlay.open { display: flex; }
    .picker-modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 720px; width: 100%;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    }
    .picker-header {
      padding: 1rem 1.2rem;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 0.8rem;
    }
    .picker-header h3 { margin: 0; color: var(--amber); font-family: var(--font-display); flex: 0 0 auto; }
    .picker-header input {
      flex: 1; padding: 0.5rem 0.7rem;
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      border-radius: 6px; font-size: 0.95rem;
    }
    .picker-header input:focus { outline: none; border-color: var(--amber); }
    .picker-close {
      background: transparent; color: var(--text-mute);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 0.3rem 0.7rem; cursor: pointer;
    }
    .picker-list {
      max-height: 70vh; overflow-y: auto;
      padding: 0.5rem 0.6rem 0.8rem;
    }
    .picker-item {
      padding: 0.6rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 0.35rem;
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
      background: var(--bg);
    }
    .picker-item:hover { border-color: var(--amber); background: var(--elevated); }
    .picker-item.empty {
      border-style: dashed; color: var(--text-dim);
      font-style: italic; text-align: center;
    }
    .picker-item-name {
      font-weight: 700; color: var(--text); font-size: 0.95rem;
      display: flex; align-items: baseline; gap: 0.5rem;
    }
    .picker-item-name > span:first-child { flex: 1; }
    /* Small info pill on filled chips — opens a read-only Details
       popup so users can review what an already-slotted item gives
       them without re-opening the picker. Sits inline-right of the
       chip text, looks like a quiet hint until hovered. */
    .chip-info {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.25rem; height: 1.25rem;
      background: transparent;
      border: none;
      border-radius: 50%;
      padding: 0;
      font-size: 0.8rem;
      line-height: 1;
      cursor: pointer;
      margin-left: 0.4rem;
      vertical-align: middle;
      opacity: 0.55;
      transition: opacity 0.12s, background 0.12s, transform 0.08s;
    }
    .chip-info:hover {
      opacity: 1;
      background: rgba(240, 136, 62, 0.18);
      transform: scale(1.15);
    }
    .chip-info:focus { outline: 1px dotted var(--amber); outline-offset: 1px; }
    /* One-line tip shown at the top of every picker that supports
       corrections. Persists across sessions — small enough not to be
       noisy, prominent enough that new users notice the ✎ pattern. */
    .picker-tip {
      display: flex; align-items: flex-start; gap: 0.5rem;
      padding: 0.55rem 0.7rem;
      margin-bottom: 0.5rem;
      background: rgba(240, 136, 62, 0.07);
      border: 1px dashed var(--amber);
      border-radius: 6px;
      color: var(--text-mute);
      font-size: 0.8rem;
      line-height: 1.4;
    }
    .picker-collar-filters {
      display: flex; gap: 0.5rem; margin-bottom: 0.6rem; flex-wrap: wrap;
    }
    .picker-collar-filter {
      flex: 1 1 auto; min-width: 120px;
      padding: 0.4rem 0.5rem;
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      font-size: 0.85rem; cursor: pointer;
    }
    .picker-collar-filter:hover { border-color: var(--amber); }
    .picker-tip-icon { font-size: 1rem; line-height: 1; flex: 0 0 auto; }
    .picker-tip-pencil {
      color: var(--amber);
      padding: 0 0.25rem;
      border: 1px solid var(--amber);
      border-radius: 3px;
      font-weight: 700;
    }
    /* "+ Add Missing Item" button shown at the top of the gear picker. */
    .picker-add-missing-btn {
      display: flex; flex-direction: column; gap: 0.15rem;
      width: 100%; text-align: left;
      padding: 0.55rem 0.75rem;
      margin-bottom: 0.6rem;
      background: rgba(76, 188, 122, 0.07);
      border: 1px dashed var(--stat-positive, #4cbc7a);
      border-radius: 6px;
      color: var(--text-bright, #fff);
      font-family: inherit; font-size: 0.92rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .picker-add-missing-btn:hover {
      background: rgba(76, 188, 122, 0.14);
      border-style: solid;
    }
    .picker-add-missing-btn .picker-add-missing-hint {
      color: var(--text-mute);
      font-size: 0.75rem;
      font-weight: 400;
    }
    /* Add-missing-item modal */
    .ami-overlay {
      position: fixed; inset: 0; z-index: 10001;
      background: rgba(0,0,0,0.7);
      display: none; align-items: flex-start; justify-content: center;
      padding: 2rem 1rem; overflow-y: auto;
    }
    .ami-overlay.open { display: flex; }
    .ami-panel {
      background: var(--bg-elev, #1c1f24);
      border: 1px solid var(--border, #2a2f37);
      border-radius: 8px;
      width: 100%; max-width: 640px;
      display: flex; flex-direction: column;
      box-shadow: 0 16px 48px rgba(0,0,0,0.6);
    }
    .ami-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.7rem 1rem;
      border-bottom: 1px solid var(--border, #2a2f37);
    }
    .ami-header h3 { margin: 0; font-size: 1.05rem; }
    .ami-close {
      background: transparent; border: none; color: var(--text-mute);
      cursor: pointer; font-size: 1.4rem; line-height: 1;
      padding: 0.2rem 0.5rem;
    }
    .ami-body { padding: 0.9rem 1rem; display: flex; flex-direction: column; gap: 0.7rem; }
    .ami-row { display: flex; flex-direction: column; gap: 0.25rem; }
    .ami-row label {
      font-size: 0.82rem; color: var(--text-mute);
    }
    .ami-row .req { color: var(--stat-negative, #d96565); }
    .ami-row input[type="text"], .ami-row input[type="number"], .ami-row textarea, .ami-row select {
      background: var(--bg, #11141a);
      border: 1px solid var(--border, #2a2f37);
      border-radius: 4px;
      color: var(--text-bright, #fff);
      font-family: inherit; font-size: 0.9rem;
      padding: 0.4rem 0.55rem;
      outline: none;
    }
    .ami-row input:focus, .ami-row textarea:focus, .ami-row select:focus {
      border-color: var(--amber, #f0883e);
    }
    .ami-stat-row { display: grid; grid-template-columns: 1fr 100px; gap: 0.4rem; }
    .ami-footer {
      display: flex; gap: 0.5rem; align-items: center;
      padding: 0.7rem 1rem;
      border-top: 1px solid var(--border, #2a2f37);
    }
    .ami-save-btn {
      background: var(--stat-positive, #4cbc7a); color: #fff;
      border: none; border-radius: 4px;
      padding: 0.5rem 1.1rem; cursor: pointer;
      font-weight: 600;
    }
    .ami-save-btn:hover { filter: brightness(1.1); }
    .ami-save-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .ami-msg { font-size: 0.85rem; }
    .ami-msg.success { color: var(--stat-positive, #4cbc7a); }
    .ami-msg.error   { color: var(--stat-negative, #d96565); }
    .ami-class-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 0.25rem 0.5rem;
      padding: 0.4rem 0.5rem;
      background: var(--bg, #11141a);
      border: 1px solid var(--border, #2a2f37);
      border-radius: 4px;
    }
    .ami-class-check {
      display: flex; align-items: center; gap: 0.4rem;
      font-size: 0.88rem; color: var(--text-bright, #fff);
      cursor: pointer;
    }
    .ami-class-check input[type="checkbox"] {
      width: 14px; height: 14px; cursor: pointer;
    }
    .ami-class-all-btn {
      background: transparent;
      border: 1px solid var(--border, #2a2f37);
      color: var(--text-bright, #fff);
      border-radius: 4px;
      padding: 0.2rem 0.7rem;
      font-size: 0.78rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .ami-class-all-btn:hover {
      background: rgba(240, 136, 62, 0.1);
      border-color: var(--amber, #f0883e);
    }
    .ami-class-all-btn.active {
      background: var(--amber, #f0883e);
      color: #000;
      border-color: var(--amber, #f0883e);
    }
    /* Universal-enchant per-slot stat groups in the Add Missing Enchantment modal */
    .ame-uni-group {
      border: 1px solid var(--border, #2a2f37);
      border-radius: 6px;
      padding: 0.5rem 0.6rem;
      margin-bottom: 0.5rem;
      display: flex; flex-direction: column; gap: 0.4rem;
    }
    .ame-uni-group.active {
      border-color: var(--amber, #f0883e);
      background: rgba(240, 136, 62, 0.06);
    }
    .ame-group-title {
      font-size: 0.82rem; font-weight: 600;
      color: var(--text-mute);
    }
    .ame-uni-group.active .ame-group-title { color: var(--amber, #f0883e); }
    /* Persistent corrections callout shown in the hero. Catches new
       users before they start building so they know the ✎ pattern
       exists on every picker row. */
    .hero-correction-callout {
      max-width: 760px;
      margin: 1.2rem auto 0;
      padding: 0.85rem 1.1rem;
      background: rgba(240, 136, 62, 0.08);
      border: 1px solid var(--amber);
      border-left: 4px solid var(--amber);
      border-radius: 6px;
      color: var(--text-default);
      font-size: 0.92rem;
      line-height: 1.5;
      text-align: left;
      display: flex;
      gap: 0.7rem;
      align-items: flex-start;
    }
    .hero-correction-callout .hcc-icon {
      font-size: 1.4rem;
      flex: 0 0 auto;
      line-height: 1.2;
    }
    .hero-correction-callout .hcc-body { flex: 1 1 auto; }
    .hero-correction-callout strong { color: var(--amber); }
    .hero-correction-callout .hcc-pencil {
      color: var(--amber);
      padding: 0 0.3rem;
      border: 1px solid var(--amber);
      border-radius: 3px;
      font-weight: 700;
    }
    /* Two-route how-to list: "fix a wrong value" (amber ✎) and "add a missing
       item" (green + Add Missing). Each row leads with a miniature of the REAL
       control the player has to hunt for, in the same colour, so the callout
       teaches the visual language of the pickers. */
    .hero-correction-callout .hcc-list {
      list-style: none;
      margin: 0.6rem 0 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .hero-correction-callout .hcc-list li {
      display: flex;
      gap: 0.55rem;
      align-items: baseline;
      font-size: 0.88rem;
      color: var(--text-mute);
    }
    .hero-correction-callout .hcc-list b { color: var(--text); font-weight: 600; }
    .hero-correction-callout .hcc-chip {
      flex: 0 0 auto;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
      line-height: 1.4;
    }
    .hero-correction-callout .hcc-chip-fix {
      color: var(--amber);
      background: rgba(240, 136, 62, 0.12);
      border: 1px solid var(--amber);
    }
    .hero-correction-callout .hcc-chip-add {
      color: var(--stat-positive, #4cbc7a);
      background: rgba(76, 188, 122, 0.10);
      border: 1px dashed var(--stat-positive, #4cbc7a);

    .hero-correction-callout .hcc-btn {

    /* Correction modal: a focused form to suggest a data fix. */

    /* Rich gear-card sub-blocks. Used inside picker-item-desc when the

        '<div id="mt-body"><div class="mt-empty">Loading the community meta…</div></div></div>';
      document.body.appendChild(ov);
      ov.addEventListener("click", function (e) { if (e.target === ov) ov.remove(); });
      document.getElementById("mt-close").addEventListener("click", function () { ov.remove(); });
      if (!hasBuildType) {
        // No build type picked yet — nothing to match a meta to, so show how

        renderMetaProgress(document.getElementById("mt-body"),
          '<b>Pick a class, paragon and role</b> to see the meta matched to your build type. Meanwhile, here\'s how close each one is to unlocking:');
        return;
      }
      if (!window.supabase) { document.getElementById("mt-body").innerHTML = '<div class="mt-empty">Can\'t reach the community server right now — try again later.</div>'; return; }
      const sb = window.supabase.createClient(
        "https://ynrfmmccarrpqjdrpvqn.supabase.co",
        "sb_publishable_RSK4LJnJ4-HQDudcRq3gRw_WJI5WIUw"
      );
      sb.rpc("meta_counts", { p_class: state.class, p_paragon: state.paragon, p_role: state.role }).then(function (res) {
        const body = document.getElementById("mt-body");
        if (!body) return;
        if (res.error || !res.data) { body.innerHTML = '<div class="mt-empty">Couldn\'t load the meta right now — please try again in a bit.</div>'; return; }

    // Clear all — resets every field to a blank build. Wipes the working
    // draft autosave and strips any #b= share hash, then reloads so the page
    // rebuilds from the `const state` defaults (same as a first-ever visit).
    // Named saves (My Builds) and user-added items are kept untouched.
    document.getElementById("clear-build").addEventListener("click", () => {
      if (!confirm("Clear all fields and start a blank build?\n\nThis wipes your current working build. Saved builds (My Builds) are kept.")) return;
      // Block any further autosave flush (debounced timer, pagehide,
      // visibilitychange) so the wiped build can't be re-written before reload.
      _suppressAutosave = true;
      clearTimeout(saveTO);
      try { localStorage.removeItem(AUTOSAVE_KEY); } catch (e) {}
      // Reload with no hash so a shared-link build doesn't reload either.
      window.location.href = window.location.pathname;

    // Catch a token coming back from the account sign-in FIRST: it clears
    // #acct= out of the URL and puts back any #b= share link that was parked

    acctCaptureFromHash();

    // Restore the player's work. A #b=... share link in the URL wins (the
    // player explicitly opened a shared build); otherwise fall back to the
    // autosaved working draft so a reload / back-button picks up where they

    if (location.hash && /b=/.test(location.hash)) {
      loadFromUrlHash();
      updateRoleClassCompatibility();
    } else {
      try {
        const rawAuto = localStorage.getItem(AUTOSAVE_KEY);
        if (rawAuto) {
          const savedAuto = JSON.parse(rawAuto);
          if (applyBuild(savedAuto)) updateRoleClassCompatibility();

     TO DISABLE AGAIN: set OPTIMIZER_ENABLED=0 in the Vercel env and redeploy.

     2026-09-10: a denial used to print a tiny grey line and the next click

     which members read as "login works, nothing happens". Now the denial is
     an amber banner with the actual fix, it is remembered for the tab

<script>
  (function () {
    var h = location.hostname;
    var local = h === 'localhost' || h === '127.0.0.1' || h === '' || location.protocol === 'file:';
    if (local) return;  // local dev loads the real optimizer directly (loader above)
    var API = 'https://premium-tau-three.vercel.app';
    window.PREMIUM_API_BASE = API;  // the injected optimizer reads this
    var KEY = 'nwcb_premium_token';
    var DENY_KEY = 'nwcb_premium_denied';  // sessionStorage — this tab only
    var JOIN = 'https://www.youtube.com/channel/UCYAaw-fpgBHP0h_fPVN4Udw/join';
    var INVITE = 'https://discord.gg/vraCFxvdW3';

    function note(html, level) {
      var n = document.getElementById('optimize-soon-note');
      if (!n) return;
      n.style.display = 'block';
      n.innerHTML = html;
      if (level === 'warn') {
        n.style.color = 'var(--text)';
        n.style.fontSize = '0.78rem';
        n.style.maxWidth = '360px';
        n.style.border = '1px solid var(--amber)';
        n.style.borderRadius = '8px';
        n.style.padding = '0.45rem 0.6rem';
        n.style.background = 'rgba(212,160,23,0.10)';
        try { n.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {}
      }
    }
    function link(href, text) {
      return '<a href="' + href + '" target="_blank" rel="noopener" style="color:var(--amber);font-weight:700;">' + text + '</a>';
    }
    function getDenied() { try { return sessionStorage.getItem(DENY_KEY); } catch (e) { return null; } }
    function setDenied(v) { try { if (v) sessionStorage.setItem(DENY_KEY, v); else sessionStorage.removeItem(DENY_KEY); } catch (e) {} }

    // Why the backend said no, in the member's terms, with the one thing that fixes it.
    function deniedHtml(reason) {
      var why;
      if (/not in the discord/i.test(reason)) {
        why = 'Discord signed you in, but that account isn\'t in our server yet. ' +
          link(INVITE, 'Join the Discord') + ' first, then sign in again.';
      } else if (/missing member role/i.test(reason)) {
        why = 'Discord signed you in, but that account doesn\'t hold the <b>Legendary N00B</b> role, ' +
          'which is what unlocks the optimizer. It is granted automatically once your YouTube membership is linked: ' +
          'Discord &rarr; Settings &rarr; Connections &rarr; add YouTube, then leave and re-join the server (or wait a few minutes). ' +
          'Not a Legendary N00B yet? ' + link(JOIN, 'Join here') + '. Lower tiers don\'t unlock it.';
      } else {
        why = 'Discord signed you in, but the membership check failed: <i>' + reason + '</i>. ' +
          link(JOIN, 'Join Legendary Noob') + ' &middot; ' + link(INVITE, 'our Discord') + '.';
      }
      return '&#128274; <b>Not unlocked.</b> ' + why +
        '<br><a href="#" id="tf-premium-retry" style="color:var(--amber);font-weight:700;">Sign in again</a>' +
        ' <span style="color:var(--text-mute);">(after fixing the above)</span>';
    }
    function showDenied(reason) {
      note(deniedHtml(reason), 'warn');
      var a = document.getElementById('tf-premium-retry');
      if (a) a.onclick = function (ev) { ev.preventDefault(); setDenied(null); login(); };
    }

    var hash = location.hash || '';
    var m = hash.match(/[#&]pt=([^&]+)/);

      var saved = false;
      try {
        localStorage.setItem(KEY, decodeURIComponent(m[1]));

      var reason = decodeURIComponent(d[1]);

      if (!token) {
        if (!viaClick) return;

        var prior = getDenied();

        return;
      }
      fetch(API + '/api/optimizer_js', { headers: { 'Authorization': 'Bearer ' + token } })
        .then(function (r) {
          if (r.ok) return r.text().then(inject);
          if (r.status === 401) {  // expired/cancelled — clear and re-login on click
            try { localStorage.removeItem(KEY); } catch (e) {}
            if (viaClick) login();
          } else if (r.status === 403) {
            // Backend kill switch is off (OPTIMIZER_ENABLED=0). Valid member,
            // feature deliberately withdrawn — say so plainly, don't blame them.
            if (viaClick) note('The optimizer is temporarily unavailable — it will be back shortly. Your membership is fine.');
          } else {
            note('&#9888;&#65039; The optimizer service hit a snag (' + r.status + ') — try again in a moment.');
          }
        })
        .catch(function () {
          note('&#9888;&#65039; Could not reach the membership server — try again in a moment.');
        });
    }

    window.nwcbPremiumGo = function () { unlock(true); };
    unlock(false);  // returning members unlock silently on page load
  })();
</script>
