name: Update Patch Notes

on:
  schedule:
    # Run daily at 6 AM UTC (1 AM EST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  actions: write   # to start the site deploy after a commit (see the last step)

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest patch notes and fill in their topics (J-7/J-8)
        # Keeps Arc's topic names per note (never their paragraphs); see the script header.
        run: python3 scripts/update_patch_notes.py

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/patch-notes.json data/patch-notes-var.js
          if git diff --cached --quiet; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-update patch notes $(date -u +%Y-%m-%d)" && git push
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi

      # A push made with the workflow's own token does not start other workflows, so new
      # patch notes would wait for the next human push to go live. Start the deploy directly.
      - name: Deploy the site if the notes changed
        if: steps.commit.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
